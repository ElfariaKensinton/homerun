name: iOS build

on:
  push:
    branches: [feat/ios-app]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - "crates/daemon/src/api/scanner.rs"
      - "crates/daemon/src/server.rs"
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - "crates/daemon/src/api/scanner.rs"
      - "crates/daemon/src/server.rs"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build HomeRun for iOS Simulator
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project ios/HomeRun.xcodeproj \
            -scheme HomeRun \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  build-daemon:
    name: Test daemon remote API
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Test authenticated remote API
        run: cargo test -p homerund remote_auth_tests
