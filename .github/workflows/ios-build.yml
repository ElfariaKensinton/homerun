name: iOS and daemon builds

on:
  push:
    branches: [feat/ios-app]
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned HomeRun IPA
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS device app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/HomeRun.xcodeproj \
            -scheme HomeRun \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HomeRun.app"
          IPA_ROOT="$RUNNER_TEMP/unsigned-ipa"
          test -d "$APP_PATH"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          /usr/bin/ditto "$APP_PATH" "$IPA_ROOT/Payload/HomeRun.app"

          # Fail the workflow if Xcode unexpectedly codesigned the app.
          if /usr/bin/codesign -dv --verbose=2 "$IPA_ROOT/Payload/HomeRun.app" >"$RUNNER_TEMP/codesign-check.txt" 2>&1; then
            cat "$RUNNER_TEMP/codesign-check.txt"
            echo "Expected an unsigned app, but a code signature was found."
            exit 1
          fi

          cd "$IPA_ROOT"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/HomeRun-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/HomeRun-unsigned.ipa"
          /usr/bin/unzip -Z1 "$GITHUB_WORKSPACE/HomeRun-unsigned.ipa" | grep -Fx "Payload/HomeRun.app/Info.plist"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeRun-unsigned-IPA
          path: HomeRun-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  test-daemon:
    name: Test daemon remote API
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Test authenticated remote API
        run: cargo test -p homerund remote_auth_tests

  build-daemon:
    name: Build homerund (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: target/release/homerund
          - os: macos-15
            platform: macos
            binary: target/release/homerund
          - os: windows-latest
            platform: windows-x86_64
            binary: target/release/homerund.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build homerund release binary
        run: cargo build --release -p homerund

      - name: Upload homerund binary
        uses: actions/upload-artifact@v4
        with:
          name: homerund-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
