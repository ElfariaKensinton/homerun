name: Apple Silicon macOS and iOS builds

on:
  push:
    branches: [feat/ios-app]
    paths:
      - "ios/**"
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: Build HomeRun macOS GUI and bundled homerund (Apple Silicon)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          rustc --version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Test authenticated remote API
        run: cargo test --target aarch64-apple-darwin -p homerund remote_api

      - name: Build daemon sidecar for the HomeRun GUI
        run: |
          set -euo pipefail
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          test "$TARGET" = "aarch64-apple-darwin"
          cargo build --release -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          install -m 755 target/release/homerund "apps/desktop/src-tauri/binaries/homerund-$TARGET"
          cp target/release/homerund homerund-macos-arm64
          chmod 755 homerund-macos-arm64
          file target/release/homerund | grep -q "arm64"

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build the existing HomeRun GUI and bundle the daemon
        run: npm run tauri -- build
        working-directory: apps/desktop

      - name: Package HomeRun macOS GUI
        run: |
          set -euo pipefail
          APP_PATH="apps/desktop/src-tauri/target/release/bundle/macos/HomeRun.app"
          DMG_PATH="$(find apps/desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -d "$APP_PATH"
          test -n "$DMG_PATH"
          MAIN_EXECUTABLE="$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          test -n "$MAIN_EXECUTABLE"
          file "$MAIN_EXECUTABLE" | grep -q "arm64"
          find "$APP_PATH/Contents" -name 'homerund*' -print -quit | grep -q .
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/HomeRun-macos-arm64.zip"
          cp "$DMG_PATH" "$GITHUB_WORKSPACE/HomeRun-macos-arm64.dmg"

      - name: Upload HomeRun macOS GUI
        uses: actions/upload-artifact@v4
        with:
          name: HomeRun-macos-arm64
          path: |
            HomeRun-macos-arm64.zip
            HomeRun-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: homerund-macos-arm64
          path: homerund-macos-arm64
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build unsigned HomeRun iOS IPA
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS device app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/HomeRun.xcodeproj \
            -scheme HomeRun \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HomeRun.app"
          IPA_ROOT="$RUNNER_TEMP/unsigned-ipa"
          test -d "$APP_PATH"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          /usr/bin/ditto "$APP_PATH" "$IPA_ROOT/Payload/HomeRun.app"

          if /usr/bin/codesign -dv --verbose=2 "$IPA_ROOT/Payload/HomeRun.app" >"$RUNNER_TEMP/codesign-check.txt" 2>&1; then
            cat "$RUNNER_TEMP/codesign-check.txt"
            echo "Expected an unsigned app, but a code signature was found."
            exit 1
          fi

          cd "$IPA_ROOT"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/HomeRun-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/HomeRun-unsigned.ipa"
          /usr/bin/unzip -Z1 "$GITHUB_WORKSPACE/HomeRun-unsigned.ipa" | grep -Fx "Payload/HomeRun.app/Info.plist"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HomeRun-unsigned-IPA
          path: HomeRun-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
